<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#071A1D">
<title>CRM · RD Solutions</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230E3B43'/%3E%3Ctext x='15' y='21' font-family='Arial' font-size='13' font-weight='800' fill='%23FBF7F1' text-anchor='middle'%3ERD%3C/text%3E%3Ccircle cx='26' cy='26' r='3' fill='%23C2462C'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
<!-- defer: não bloqueia o primeiro desenho; roda em ordem, antes do app.js (módulo). integrity: o CDN não consegue trocar o arquivo. -->
<script defer src="https://cdn.jsdelivr.net/npm/convex@1.46.0/dist/browser.bundle.js" integrity="sha384-YNc7767fowceX6PDv5ZiwoWOkzKK4WvGm4rfXHCBsghW2Y2S3susFrnDG0+0JAWe" crossorigin="anonymous"></script>
<script defer src="config.js"></script>
<script type="module" src="app.js"></script>
</head>
<body>
<a class="skip" href="#main">Pular para o conteúdo</a>
<div class="app">
  <aside class="side" id="side" aria-label="Menu">
    <div class="side-brand">
      <span class="brand-mark" aria-hidden="true">RD</span>
      <span class="brand-txt">RD Solutions<small>CRM · leads e clientes</small></span>
      <button class="icon-btn side-close" id="side-close" type="button" aria-label="Fechar menu">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 5l10 10M15 5L5 15"/></svg>
      </button>
    </div>
    <nav class="side-nav" id="side-nav"></nav>
    <div class="side-foot">
      <span class="avatar" aria-hidden="true">P</span>
      <span class="side-user">Pedro<small>Responsável</small></span>
      <button class="btn ghost sm" id="btn-sair" type="button" hidden>Sair</button>
    </div>
  </aside>
  <div class="side-scrim" id="side-scrim" hidden></div>
  <div class="content">
    <header class="top">
      <button class="icon-btn menu-btn" id="menu-btn" type="button" aria-label="Abrir menu" aria-controls="side" aria-expanded="false">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 5h14M3 10h14M3 15h14"/></svg>
      </button>
      <button class="search-btn" id="search-btn" type="button" aria-label="Buscar lead (atalho Cmd K)">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="9" r="5.5"/><path d="M13.5 13.5L17 17"/></svg>
        <span>Buscar por nome, empresa ou @</span>
        <kbd>⌘K</kbd>
      </button>
      <span class="live" id="live" role="status">Conectando…</span>
    </header>
    <main id="main" tabindex="-1">
      <p class="loading">Carregando…</p>
    </main>
  </div>
</div>
<div id="layer"></div>
<div class="toast-box" id="toasts" aria-live="polite"></div>
</body>
</html>
